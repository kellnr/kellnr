name: Release

on:
  release:
    types:
      - published

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The release commit was already tested on main. Wait for that run
  # instead of running all tests again.
  test:
    name: Check Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for the Test workflow of the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Give a just merged commit some time to start its run.
          for attempt in $(seq 1 170); do
            run=$(gh api "repos/$REPO/actions/workflows/test.yaml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | select(.) | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              if [ "$attempt" -ge 20 ]; then
                echo "No Test run found for $SHA. Start the Test workflow for this commit and re-run this job."
                exit 1
              fi
            else
              # Split "status conclusion url" into $1 $2 $3.
              # shellcheck disable=SC2086
              set -- $run
              echo "Test run $3: $1 $2"
              if [ "$1" = "completed" ]; then
                [ "$2" = "success" ] && exit 0
                echo "The tests of $SHA did not pass. Fix them or re-run the Test workflow, then re-run this job."
                exit 1
              fi
            fi
            sleep 30
          done
          echo "Timed out waiting for the Test run of $SHA."
          exit 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-26.04
    needs: [test]
    permissions: { contents: write }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with: { nix_path: "nixpkgs=channel:nixos-unstable" }

      - name: Extract Version
        run: |
          echo "VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Generate SBOMs
        run: |
          nix develop --command just sbom-binary
          mkdir sboms
          for sbom in kellnr kellnr-binary-linux kellnr-binary-windows kellnr-binary-macos; do
            mv "$sbom.cdx.json" "sboms/$sbom-$VERSION.cdx.json"
          done

      - name: Upload SBOMs to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sboms/*.cdx.json
          file_glob: true
          tag: ${{ github.ref }}

  build-kellnr:
    name: Build Binaries
    runs-on: ubuntu-26.04
    needs: [test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target:
          [
            "x86_64-unknown-linux-gnu",
            "x86_64-unknown-linux-musl",
            "aarch64-unknown-linux-gnu",
            "aarch64-unknown-linux-musl",
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update APT Repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y sed zip

      - name: Install Just
        uses: taiki-e/install-action@v2.90.1
        with: { tool: just }

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2

      - name: Add Rust Targets
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-rs
        uses: taiki-e/install-action@v2.90.1
        with: { tool: cross }

      - name: Extract Version
        run: |
          echo "KELLNR_COMPTIME__VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
          echo $KELLNR_COMPTIME__VERSION

      - name: Build Release ${{ matrix.target }}
        run: just target=${{ matrix.target }} ci-release

      - name: Set Package Name
        run: echo "KELLNR_PACKAGE=kellnr-${{ matrix.target }}-$KELLNR_COMPTIME__VERSION.zip" >> $GITHUB_ENV

      - name: Print Package Name
        run: echo $KELLNR_PACKAGE

      - name: Package Kellnr
        uses: montudor/action-zip@v1.0.0
        with:
          args: zip -qq -j ${{ env.KELLNR_PACKAGE }} target/${{ matrix.target }}/release/kellnr

      # The Docker images verify this attestation before they use the zip.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.KELLNR_PACKAGE }}

      - name: Set Asset Name
        run: echo "KELLNR_ASSET=kellnr-${{ matrix.target }}.zip" >> $GITHUB_ENV

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.KELLNR_PACKAGE }}
          asset_name: ${{ env.KELLNR_ASSET }}
          tag: ${{ github.ref }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: kellnr-x86_64-windows
          - target: aarch64-pc-windows-msvc
            artifact: kellnr-aarch64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Just
        uses: taiki-e/install-action@v2.90.1
        with: { tool: just }

      - name: Extract Version
        shell: bash
        run: |
          echo "KELLNR_COMPTIME__VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Build UI assets
        run: just npm-build

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Package Kellnr
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/kellnr.exe -DestinationPath ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip
          asset_name: ${{ matrix.artifact }}.zip
          tag: ${{ github.ref }}

  build-macos:
    name: Build macOS
    runs-on: macos-26
    needs: [test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: kellnr-aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Just
        uses: taiki-e/install-action@v2.90.1
        with: { tool: just }

      - name: Extract Version
        run: |
          echo "KELLNR_COMPTIME__VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Build UI assets
        run: just npm-build

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm -f cert.p12

      - name: Sign binary
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" \
            target/${{ matrix.target }}/release/kellnr
          codesign --verify --strict --verbose=2 target/${{ matrix.target }}/release/kellnr

      - name: Package Kellnr
        run: |
          zip -qq -j \
            ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip \
            target/${{ matrix.target }}/release/kellnr

      - name: Notarize
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > AuthKey.p8
          xcrun notarytool submit \
            ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip \
            --key AuthKey.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          rm -f AuthKey.p8

      # Attest after notarization, so only archives accepted by Apple are attested.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact }}-${{ env.KELLNR_COMPTIME__VERSION }}.zip
          asset_name: ${{ matrix.artifact }}.zip
          tag: ${{ github.ref }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f cert.p12 AuthKey.p8

  crates-io-release:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Install Just
        uses: taiki-e/install-action@v2.90.1
        with: { tool: just }

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2

      - name: Build static resources
        run: just npm-build

      - name: Publish to crates.io
        uses: secana/k-releaser@v1
        with:
          command: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-and-push-image:
    name: Build and Push Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    needs: [build-kellnr, sbom]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - variant: standard
            dockerfile: docker/Dockerfile
            image: ghcr.io/kellnr/kellnr
            linkage: gnu
          - variant: minimal
            dockerfile: docker/Dockerfile.minimal
            image: ghcr.io/kellnr/kellnr-minimal
            linkage: musl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Version
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
          echo $RELEASE_VERSION

      # The images take kellnr from the release zips. Only use zips that were
      # attested by this workflow for this tag, and pin them by digest.
      - name: Download and verify release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKAGE: ${{ matrix.linkage }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cd release-assets
          amd64="kellnr-x86_64-unknown-linux-$LINKAGE.zip"
          arm64="kellnr-aarch64-unknown-linux-$LINKAGE.zip"
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$amd64" --pattern "$arm64" --pattern "kellnr-binary-linux-$RELEASE_VERSION.cdx.json"
          for zip in "$amd64" "$arm64"; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "$GITHUB_REF"
          done
          echo "sha256-amd64=$(sha256sum "$amd64" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sha256-arm64=$(sha256sum "$arm64" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, X.Y and X for releases, only the full version for pre-releases.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            KELLNR_SHA256_AMD64=${{ steps.assets.outputs.sha256-amd64 }}
            KELLNR_SHA256_ARM64=${{ steps.assets.outputs.sha256-arm64 }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The SBOM of the image only sees the OS packages, not the crates and
      # npm packages compiled into kellnr. Attach the SBOM of the binary.
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-assets/kellnr-binary-linux-${{ env.RELEASE_VERSION }}.cdx.json
          push-to-registry: true

  # Attaches the SBOM of each platform to its release archives, so
  # "gh attestation verify --predicate-type https://cyclonedx.org/bom"
  # works for every archive.
  attest-sboms:
    name: Attest SBOMs of the Binaries
    runs-on: ubuntu-26.04
    needs: [sbom, build-kellnr, build-windows, build-macos]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release archives and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "kellnr-*.zip"
          for platform in linux windows macos; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "kellnr-binary-$platform-$version.cdx.json" --output "kellnr-binary-$platform.cdx.json"
          done
          ls -l

      - name: Attest Linux SBOM
        uses: actions/attest@v4
        with:
          subject-path: kellnr-*-unknown-linux-*.zip
          sbom-path: kellnr-binary-linux.cdx.json

      - name: Attest Windows SBOM
        uses: actions/attest@v4
        with:
          subject-path: kellnr-*-windows.zip
          sbom-path: kellnr-binary-windows.cdx.json

      - name: Attest macOS SBOM
        uses: actions/attest@v4
        with:
          subject-path: kellnr-*-apple-darwin.zip
          sbom-path: kellnr-binary-macos.cdx.json

  dispatch-helm:
    name: Update Helm Chart
    runs-on: ubuntu-26.04
    needs: [build-and-push-image]
    steps:
      - name: Extract Version
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
          echo $RELEASE_TAG
          echo $RELEASE_VERSION

      - name: Dispatch event to kellnr/helm
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          OWNER: kellnr
          REPO: helm
          EVENT_TYPE: kellnr_release
          VERSION: ${{ env.RELEASE_VERSION }}
          TAG: ${{ env.RELEASE_TAG }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing secret REPO_DISPATCH_TOKEN"
            exit 1
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$OWNER/$REPO/dispatches \
            -d "{\"event_type\":\"$EVENT_TYPE\",\"client_payload\":{\"version\":\"$VERSION\",\"tag\":\"$TAG\",\"source_repo\":\"$GITHUB_REPOSITORY\"}}"

  dispatch-website:
    name: Update Website Release Notes
    runs-on: ubuntu-26.04
    needs: [build-and-push-image]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate changelog-style JSON payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 .github/scripts/release_notes_to_kac_json.py > release_payload.json
          cat release_payload.json

      - name: Dispatch event to kellnr/website
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          OWNER: kellnr
          REPO: website
          EVENT_TYPE: kellnr_release_notes
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing secret REPO_DISPATCH_TOKEN"
            exit 1
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$OWNER/$REPO/dispatches \
            -d "$(python3 - <<'PY'
          import json, os

          payload_path = "release_payload.json"
          with open(payload_path, "r", encoding="utf-8") as f:
            payload = json.load(f)

          print(json.dumps({
            "event_type": os.environ["EVENT_TYPE"],
            "client_payload": payload
          }, ensure_ascii=False))
          PY
          )"
