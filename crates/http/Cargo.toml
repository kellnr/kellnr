[package]
name = "kellnr-http"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
# Test helpers like `test_support::test_state()`. Enable only from dev-dependencies.
test-support = [
  "dep:kellnr-test-db",
  "kellnr-db/mock",
  "kellnr-db/test-support",
  "kellnr-settings/test-support",
]

[dependencies]
# Internal dependencies from Kellnr
kellnr-common.workspace = true
kellnr-cratesio-sync.workspace = true
kellnr-db.workspace = true
kellnr-filter.workspace = true
kellnr-settings.workspace = true
kellnr-storage.workspace = true
kellnr-test-db = { workspace = true, optional = true }

# External dependencies from crates.io
axum-extra.workspace = true
axum.workspace = true
base64.workspace = true
cookie.workspace = true
flume.workspace = true
moka.workspace = true
provcfg.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
zip.workspace = true

[dev-dependencies]
kellnr-settings = { workspace = true, features = ["test-support"] }
kellnr-db = { workspace = true, features = ["mock"] }
hyper.workspace = true
mockall.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
tower.workspace = true

[lints]
workspace = true
