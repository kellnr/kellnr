[package]
name = "kellnr"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "../../README.md"

[dependencies]
# Internal dependencies from Kellnr
kellnr-common.workspace = true
kellnr-cratesio-sync.workspace = true
kellnr-db.workspace = true
kellnr-docgen.workspace = true
kellnr-docs.workspace = true
kellnr-embedded-resources.workspace = true
kellnr-filter.workspace = true
kellnr-http.workspace = true
kellnr-index.workspace = true
kellnr-oauth2.workspace = true
kellnr-registry.workspace = true
kellnr-settings.workspace = true
kellnr-storage.workspace = true
kellnr-toolchain.workspace = true
kellnr-web-ui.workspace = true
kellnr-webhooks.workspace = true

# External dependencies from crates.io
axum-extra.workspace = true
axum.workspace = true
bytes.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
flume.workspace = true
mime_guess.workspace = true
serde.workspace = true
moka.workspace = true
rustls.workspace = true
openssl = { version = "0.10", optional = true } # Not needed directly but for cross-compilation with the vendored-openssl feature
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[dev-dependencies]
kellnr-settings = { workspace = true, features = ["test-support"] }
kellnr-db = { workspace = true, features = ["test-support"] }
kellnr-http = { workspace = true, features = ["test-support"] }
kellnr-test-db.workspace = true
kellnr-rustfs-testcontainer.workspace = true
# Path only (no version), so cargo drops it when packaging kellnr.
# The test helper itself is never published.
kellnr-fakegcs-testcontainer = { path = "../storage/fakegcs-testcontainer" }
chrono.workspace = true
hyper.workspace = true
reqwest.workspace = true
serde_json.workspace = true
testcontainers.workspace = true
tower.workspace = true
zip.workspace = true

[features]
default = ["vendored-openssl"]
vendored-openssl = ["openssl/vendored"]

# Ignore openssl in cargo machete, else
# "cargo machete" will show openssl as an unused depedenency
[package.metadata.cargo-machete]
ignored = ["openssl"]

[lints]
workspace = true
