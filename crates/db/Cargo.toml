[package]
name = "kellnr-db"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
# Internal dependencies from Kellnr
kellnr-common.workspace = true
kellnr-entity.workspace = true
kellnr-migration.workspace = true
kellnr-settings.workspace = true

# External dependencies from crates.io
argon2.workspace = true
chrono.workspace = true
mockall = { workspace = true, optional = true }
percent-encoding.workspace = true
utoipa.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha256.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[features]
# Cheap password hashing and test_utils for tests. Only enable it from dev-dependencies.
test-support = []
# The generated `MockDb`. Only enable it from dev-dependencies.
mock = ["dep:mockall"]

[dev-dependencies]
# Path only, without a version: cargo leaves such dev-dependencies out of the
# published crate. kellnr-test-db depends on kellnr-db, so with a version
# neither crate could be published first.
kellnr-db = { path = ".", features = ["mock", "test-support"] }
kellnr-db-testcontainer.workspace = true
kellnr-test-db = { path = "test-db" }
tempfile.workspace = true
url.workspace = true

[lints]
workspace = true
